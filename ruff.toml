line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = [
    "E402",   # gi.require_version() must run before importing Gtk
    "B008",
    "UP031",
]

[lint.isort]
known-first-party = ["klawdy"]

[lint.per-file-ignores]
"app/klawdy/strings_en.py" = ["E501"]
