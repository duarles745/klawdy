name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Ruff
        run: pipx run ruff check app tests
      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh app/*.sh tests/*.sh

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq python3-gi python3-gi-cairo gir1.2-gtk-3.0 python3-numpy
      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -t . -v

  clean-install:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install, check and uninstall on a fresh system
        run: bash tests/clean_install.sh
